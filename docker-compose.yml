services:
  # Nginx Webサーバー
  web:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: movie_prf_web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - movie_prf_network

  # PHP + Laravel アプリケーション
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: movie_prf_app
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=movie_prf
      - DB_PASSWORD=secret
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=videos
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      - db
      - minio
    networks:
      - movie_prf_network

  # PostgreSQL データベース (pgvector 拡張同梱)
  db:
    image: pgvector/pgvector:pg16
    container_name: movie_prf_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: movie_prf
      POSTGRES_USER: movie_prf
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - movie_prf_network

  # MinIO (S3エミュレータ)
  minio:
    image: minio/minio:latest
    container_name: movie_prf_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - movie_prf_network

volumes:
  db_data:
    driver: local
  minio_data:
    driver: local

networks:
  movie_prf_network:
    driver: bridge
