# =====================================================================
# コンテナ内 nginx 設定（laravel-web タスク用）
# - port 80 で listen、ECS bridge で host port 8080 にマップ
# - PHP リクエストは fastcgi で 127.0.0.1:9000（同コンテナ内 php-fpm）へ
# - SSL はホスト nginx 側で終端するのでここでは扱わない
# =====================================================================

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # 動画アップロード対応（最大 100MB）
    client_max_body_size 100M;
    client_body_timeout 300s;
    fastcgi_read_timeout 300s;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        # Laravel 標準ルーティング
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP リクエストを php-fpm へ
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # 隠しファイルへのアクセスを拒否（.env 等）
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
