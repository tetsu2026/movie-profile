; 動画アップロード用PHP設定
; upload_max_filesize は Laravel バリデーション(StoreVideoRequest の max:5120 = 5MB)より少し大きく設定
; 同値だと 5MB 超ファイルが PHP 段階で破棄され「The video failed to upload」になり、
; Laravel の親切メッセージ「ファイルサイズは5MB以内にしてください」が出なくなるため
; post_max_size は upload_max_filesize より大きく(他フォームフィールド + multipart オーバーヘッド吸収)
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
