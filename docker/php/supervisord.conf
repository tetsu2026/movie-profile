; =====================================================================
; supervisord 設定（laravel-web タスク用）
; nginx と php-fpm を同居起動する。
; stdout/stderr はコンテナの 1/2 に流し、ECS awslogs ドライバで CloudWatch Logs へ。
; worker タスクでは ECS タスク定義の command でこの設定を上書き起動しないため、
; supervisord 自体が走らない（queue:work プロセスが PID 1 として動く）。
; =====================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
