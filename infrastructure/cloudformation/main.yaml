AWSTemplateFormatVersion: '2010-09-09'
Description: Main stack for Movie Profile Platform - Nested stack orchestration

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: Environment name

  AdminIP:
    Type: String
    Description: Admin IP address for SSH access (CIDR format, e.g., 203.0.113.0/32)
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR format

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair name for SSH access

  DBMasterUsername:
    Type: String
    Default: admin
    Description: Master username for RDS
    MinLength: 1
    MaxLength: 16

  DBMasterPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS (min 8 characters)
    MinLength: 8
    MaxLength: 41

  TemplatesBucketName:
    Type: String
    Description: S3 bucket name where CloudFormation templates are stored

  BucketNameSuffix:
    Type: String
    Description: Unique suffix for S3 bucket name (e.g., AWS account ID)

Resources:
  # VPC Stack
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/templates/vpc.yaml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-vpc-stack
        - Key: Environment
          Value: !Ref Environment

  # Security Groups Stack
  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/templates/security-groups.yaml
      Parameters:
        Environment: !Ref Environment
        VpcId: !GetAtt VPCStack.Outputs.VpcId
        AdminIP: !Ref AdminIP
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-sg-stack
        - Key: Environment
          Value: !Ref Environment

  # S3 Stack
  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/templates/s3.yaml
      Parameters:
        Environment: !Ref Environment
        BucketNameSuffix: !Ref BucketNameSuffix
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-s3-stack
        - Key: Environment
          Value: !Ref Environment

  # IAM Stack
  IAMStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: S3Stack
    Properties:
      TemplateURL: !Sub https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/templates/iam.yaml
      Parameters:
        Environment: !Ref Environment
        VideosBucketName: !GetAtt S3Stack.Outputs.BucketName
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-iam-stack
        - Key: Environment
          Value: !Ref Environment

  # RDS Stack
  RDSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - SecurityGroupsStack
    Properties:
      TemplateURL: !Sub https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/templates/rds.yaml
      Parameters:
        Environment: !Ref Environment
        PrivateSubnet1Id: !GetAtt VPCStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt VPCStack.Outputs.PrivateSubnet2Id
        RDSSecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.RDSSecurityGroupId
        DBMasterUsername: !Ref DBMasterUsername
        DBMasterPassword: !Ref DBMasterPassword
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-rds-stack
        - Key: Environment
          Value: !Ref Environment

  # EC2 Stack
  EC2Stack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - SecurityGroupsStack
      - IAMStack
      - S3Stack
    Properties:
      TemplateURL: !Sub https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/templates/ec2.yaml
      Parameters:
        Environment: !Ref Environment
        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnetId
        EC2SecurityGroupId: !GetAtt SecurityGroupsStack.Outputs.EC2SecurityGroupId
        EC2InstanceProfileName: !GetAtt IAMStack.Outputs.EC2InstanceProfileName
        KeyPairName: !Ref KeyPairName
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-ec2-stack
        - Key: Environment
          Value: !Ref Environment

Outputs:
  # VPC Outputs
  VpcId:
    Description: VPC ID
    Value: !GetAtt VPCStack.Outputs.VpcId

  # EC2 Outputs
  EC2PublicIP:
    Description: EC2 Elastic IP Address
    Value: !GetAtt EC2Stack.Outputs.EC2PublicIP

  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !GetAtt EC2Stack.Outputs.EC2InstanceId

  SSHCommand:
    Description: SSH command to connect to EC2
    Value: !GetAtt EC2Stack.Outputs.SSHCommand

  WebURL:
    Description: Web URL (HTTP)
    Value: !GetAtt EC2Stack.Outputs.WebURL

  # RDS Outputs
  RDSEndpoint:
    Description: RDS Endpoint Address
    Value: !GetAtt RDSStack.Outputs.RDSEndpoint

  RDSPort:
    Description: RDS Port
    Value: !GetAtt RDSStack.Outputs.RDSPort

  DBName:
    Description: Database Name
    Value: !GetAtt RDSStack.Outputs.DBName

  # S3 Outputs
  VideosBucketName:
    Description: Videos S3 Bucket Name
    Value: !GetAtt S3Stack.Outputs.BucketName

  VideosBucketDomainName:
    Description: Videos S3 Bucket Domain Name
    Value: !GetAtt S3Stack.Outputs.BucketDomainName

  # Environment Configuration Summary
  EnvironmentConfig:
    Description: Environment configuration for .env file
    Value: !Sub |
      # AWS Resources Configuration
      # Add these to your Laravel .env file
      #
      # Database
      # DB_HOST=${RDSStack.Outputs.RDSEndpoint}
      # DB_PORT=${RDSStack.Outputs.RDSPort}
      # DB_DATABASE=movie_prf
      # DB_USERNAME=${DBMasterUsername}
      # DB_PASSWORD=<your-password>
      #
      # S3
      # AWS_BUCKET=${S3Stack.Outputs.BucketName}
      # AWS_DEFAULT_REGION=${AWS::Region}
      #
      # App URL
      # APP_URL=http://${EC2Stack.Outputs.EC2PublicIP}
