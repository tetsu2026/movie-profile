AWSTemplateFormatVersion: '2010-09-09'
Description: Security Groups for Movie Profile Platform

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name

  VpcId:
    Type: String
    Description: VPC ID

  AdminIP:
    Type: String
    Description: Admin IP address for SSH access (CIDR format, e.g., 203.0.113.0/32)
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR format (e.g., 203.0.113.0/32)

Resources:
  # EC2 Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${Environment}-movie-prf-ec2-sg
      GroupDescription: Security group for EC2 instance (Web server)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # HTTP (80) - 全IPから許可
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access from anywhere
        # HTTPS (443) - 将来のHTTPS対応用
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access from anywhere
        # SSH (22) - 管理者IPのみ
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIP
          Description: SSH access from admin IP only
      SecurityGroupEgress:
        # 全アウトバウンド許可
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-ec2-sg
        - Key: Environment
          Value: !Ref Environment

  # RDS Security Group
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${Environment}-movie-prf-rds-sg
      GroupDescription: Security group for RDS instance (MySQL)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # MySQL (3306) - EC2セキュリティグループからのみ許可
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: MySQL access from EC2 only
      SecurityGroupEgress:
        # 全アウトバウンド許可
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${Environment}-movie-prf-rds-sg
        - Key: Environment
          Value: !Ref Environment

Outputs:
  EC2SecurityGroupId:
    Description: EC2 Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub ${Environment}-EC2SecurityGroupId

  RDSSecurityGroupId:
    Description: RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub ${Environment}-RDSSecurityGroupId
